schema_version: "0.2"

harness:
  repository: gharbonnier78/scientific-research-harness
  ref: "e8e043c2b66a74ccacd023d67a32f989885449eb"
  entrypoint: HARNESS.md
  status: "immutable reviewed main commit"
  upgrade_rule: "Upgrade only through an explicit change that records whether scientific meaning, execution semantics, or pedagogy is affected. Never follow main silently."

consumer:
  repository: "gharbonnier78/engineering-collective-forecasting"
  project_id: "engineering-collective-forecasting"
  instruction_entrypoints:
    - AGENTS.md

authority:
  sources:
    - id: "source-notes"
      reference: "research/sources/"
      role: "Per-source notes describing what external literature supports and does not support."
    - id: "study0-preregistration"
      reference: "studies/study-0-shadow-forecasting/preregistration.md"
      role: "Prospective authority for Study 0A/0B target population, baselines, aggregation, estimands, stopping and analysis once frozen."
    - id: "forecast-contracts"
      reference: "schemas/forecast-contract.schema.json"
      role: "Local machine-readable contract for prospective event semantics, institutional references, resolution and safeguards."
  domain_experts: []
  prohibited_substitution:
    - "The harness, LLM, Diderot, poll, market or model does not replace authoritative engineering evidence or accountable decision ownership."

artifacts:
  claims:
    - research/claims.yaml
    - paper/engineering_collective_forecasting.tex
  evidence:
    - studies/study-0-shadow-forecasting/evidence/README.md
  scientific_gates:
    - research/gates.yaml
  chronicle:
    - research/chronicle/
  pedagogy:
    - docs/pedagogy.md
    - research/sources/
  handoff: "research/chronicle/2026-09-26--review-v2-redesign.md"

execution:
  engineering:
    care_profile: "POC"
    rationale: "The repository contains protocol validation, reference analysis and paper-build code but no deployed participant-facing service. The POC profile remains appropriate before live data collection."
    required_checks:
      - "python -m pip install -r requirements.txt"
      - "python -m compileall analysis scripts tests"
      - "python scripts/check_secrets.py"
      - "python scripts/validate_repo.py"
      - "python -m unittest discover -s tests -v"
      - "make paper"
    deferred_controls:
      - control: "Production threat model, identity controls and private data-store controls"
        risk: "Required before any live employee forecast collection or connector/SSO deployment."
        escalation_trigger: "Any participant-facing service, employee-data ingestion, SSO integration, external platform, or automated connection to internal engineering systems."
        next_action: "Upgrade engineering-care profile and create deployment-specific security/privacy evidence before exposure."
  environment_lock: "Python validation dependencies are pinned in requirements.txt. CI runner is pinned to ubuntu-24.04; the paper build records pdflatex/latexmk versions and normalizes source time. Reproducibility claims are bounded to the recorded environment, not all future TeX distributions."
  replay_commands:
    - "python -m pip install -r requirements.txt"
    - "python -m compileall analysis scripts tests"
    - "python scripts/check_secrets.py"
    - "python scripts/validate_repo.py"
    - "python -m unittest discover -s tests -v"
    - "make paper"
  randomness:
    status: "declared"
    root_entropy_policy: "Reference uncertainty analysis uses the frozen integer seed declared in the deployment preregistration and resamples independent operational clusters, never participant rows or timestamps."
    lineage_artifact: "studies/study-0-shadow-forecasting/preregistration.md"
  concurrency:
    status: "not_applicable"
    reference_path: null
    equivalence_evidence: null

local_extensions:
  - "Forecast Contract as a local evidence-resolution object."
  - "Dry contract funnel before participant forecasting."
  - "Private collective forecasting against same-time institutional references."
  - "Actor/observer design factor and independent pre-resolution data custody."

deviations:
  - id: "LATEX-ENV-001"
    status: "bounded"
    rationale: "GitHub-hosted ubuntu-24.04 is not a forever-immutable container image. The workflow records tool versions and verifies same-head deterministic rebuilds; cross-era bit identity is not claimed."

adoption:
  adopted_at: "2026-09-25"
  amended_at: "2026-09-26"
  adopted_by: "ChatGPT with explicit user authorization"
  notes: "Bootstrap protocol received independent PARTIAL ACCEPT at c8a3516. The 2026-09-26 amendment applies SDR-002 by removing the prediction market from Study 0, adding a dry contract funnel and redefining incremental usefulness against owner, official status and base-rate references."
