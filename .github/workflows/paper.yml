name: paper
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-pictures texlive-bibtex-extra
      - name: Build PDF
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error engineering_collective_forecasting.tex
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: engineering-collective-forecasting-paper
          path: paper/engineering_collective_forecasting.pdf
