schema_version: "0.2"
gates:
  - id: G0
    name: Harness binding
    status: PASS
    criterion: "Immutable harness ref, local manifest, agent instructions, Chronicle and source/claim boundaries exist."

  - id: G1
    name: Protocol review
    status: PENDING_REREVIEW
    criterion: "The redesigned minimum-sufficient Study 0A/0B protocol, schema, safeguards, analysis and paper receive independent exact-head review."
    history: "Bootstrap head c8a3516 received PARTIAL ACCEPT on 2026-09-26; G1 was not released."

  - id: G2
    name: Organizational authorization
    status: NOT_STARTED
    criterion: "Any Study 0B private pilot has explicit authorization for employee participation, data custody, confidentiality, non-HR use and non-interference."

  - id: G3
    name: Prospective freeze
    status: NOT_STARTED
    criterion: "Study 0A feasibility thresholds are frozen before intake; Study 0B target population, base-rate availability rule, owner/official references, participant eligibility/composition, aggregation constants, non-inferiority margin, stopping rule and initial contracts are frozen before participant outcomes are inspected."

  - id: G4
    name: Study 0 execution
    status: NOT_STARTED
    criterion: "Study 0A dry funnel and, only if admissible, Study 0B private elicitation execute under the frozen protocol."

  - id: G5
    name: Outcome resolution
    status: NOT_STARTED
    criterion: "Contracts resolve from predeclared authoritative evidence; ambiguity and missing evidence remain visible."

  - id: G6
    name: Analysis replay
    status: NOT_STARTED
    criterion: "Analysis replays from frozen data using the declared contract/cluster unit and exact aggregation constants."

  - id: G7
    name: Scientific review
    status: NOT_STARTED
    criterion: "Results and bounded claims receive independent evidence-based review."

  - id: G8
    name: Operational-use consideration
    status: BLOCKED_BY_DESIGN
    criterion: "No forecast evidence is exposed for real engineering decisions until a separately reviewed intervention/decision-value protocol (currently Study 3) is authorized."
